# =============================================================================
# COMMON CONFIG
# Top-level settings shared by every env. NOTE: AeroSpace loads exactly ONE
# TOML file and has NO include/import directive (checked upstream docs), so
# work/personal envs live below as [mode.work.binding] / [mode.personal.binding]
# sections in this same file. aerospace.toml.BAK is a frozen copy, do not touch.
# =============================================================================

# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# Work env: W1-W0. Personal env: P1-P0. Commons (both envs): A/S/D/F.
# NOTE: legacy "1"-"9" names were dropped on purpose so old workspaces die out.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = ["W1", "W2", "W3", "W4", "W5", "W6", "W7", "W8", "W9", "W0",
                         "P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8", "P9", "P0",
                         "A", "S", "D", "F"]

# A callback that runs every time binding mode changes
# Env switches notify explicitly in their own bindings (no extra deps needed),
# so this stays empty.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Remembers the last W*/P* workspace per env (see record-env.sh). State lives
# in ~/.cache so it never syncs over Syncthing. Commons/legacy names ignored.
exec-on-workspace-change = ['/bin/bash', '-c', '~/.config/aerospace/record-env.sh']

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 0
    inner.vertical =   0
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

# =============================================================================
# MODE: main — LOBBY (neutral, no env workspaces)
# Pick an env: alt-w -> work (lands W1), alt-e -> personal (lands P1).
# Commons (asdf) work here.
# 'main' binding mode must be always presented.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# Fallback value (if you omit the key): mode.main.binding = {}
# =============================================================================
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    alt-enter = '''exec-and-forget osascript -e '
    tell application "ghostty"
        do script ""
        activate
    end tell
    ' '''

    alt-b = '''exec-and-forget osascript -e '
    tell application "Safari"
        activate
    end tell
    ' '''


    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Env entry. Numbers are intentionally NOT bound here (lobby has no env).
    # alt-w always means work, alt-e always means personal, in every mode.
    # Each key flips the keymap, then goto-env.sh lands on that env's last
    # workspace (home base W1/P1 when nothing recorded yet).
    alt-w = ['mode work', '''exec-and-forget ~/.config/aerospace/goto-env.sh work''', '''exec-and-forget osascript -e 'display notification "WORK env" with title "AeroSpace"' ''']
    alt-e = ['mode personal', '''exec-and-forget ~/.config/aerospace/goto-env.sh personal''', '''exec-and-forget osascript -e 'display notification "PERSONAL env" with title "AeroSpace"' ''']

    # Commons (shared by both envs): A=Ente Auth, S=Sublime, D=Bitwarden, F=spare.
    alt-a = 'workspace A'
    alt-s = 'workspace S'
    alt-d = 'workspace D'
    alt-f = 'workspace F'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-f = 'move-node-to-workspace F'

    # Random wallpaper (mac-only script, stowed to ~/.config/wallpaper-randomizer)
    alt-shift-n = 'exec-and-forget WALL_DIR=~/syncthing/PC-Walls ~/.config/wallpaper-randomizer/wallpaperRandom.sh'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    # NOTE: this is global and WILL jump across envs. Kept on purpose.
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# =============================================================================
# MODE: work — WORK ENV (W1-W0 + commons)
# Same keys as personal, different workspaces. alt-w stays here, alt-e jumps
# to personal; both land on that env's last workspace via goto-env.sh. Tray icon shows W<n> so env is always visible.
# (Key/modifier reference lives in [mode.main.binding] above.)
# =============================================================================
[mode.work.binding]

    alt-enter = '''exec-and-forget osascript -e '
    tell application "ghostty"
        do script ""
        activate
    end tell
    ' '''

    alt-b = '''exec-and-forget osascript -e '
    tell application "Safari"
        activate
    end tell
    ' '''

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Work workspaces 1..0
    alt-1 = 'workspace W1'
    alt-2 = 'workspace W2'
    alt-3 = 'workspace W3'
    alt-4 = 'workspace W4'
    alt-5 = 'workspace W5'
    alt-6 = 'workspace W6'
    alt-7 = 'workspace W7'
    alt-8 = 'workspace W8'
    alt-9 = 'workspace W9'
    alt-0 = 'workspace W0'

    alt-shift-1 = 'move-node-to-workspace W1'
    alt-shift-2 = 'move-node-to-workspace W2'
    alt-shift-3 = 'move-node-to-workspace W3'
    alt-shift-4 = 'move-node-to-workspace W4'
    alt-shift-5 = 'move-node-to-workspace W5'
    alt-shift-6 = 'move-node-to-workspace W6'
    alt-shift-7 = 'move-node-to-workspace W7'
    alt-shift-8 = 'move-node-to-workspace W8'
    alt-shift-9 = 'move-node-to-workspace W9'
    alt-shift-0 = 'move-node-to-workspace W0'

    # Commons (same targets as every other mode)
    alt-a = 'workspace A'
    alt-s = 'workspace S'
    alt-d = 'workspace D'
    alt-f = 'workspace F'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-f = 'move-node-to-workspace F'

    # Random wallpaper (same as main)
    alt-shift-n = 'exec-and-forget WALL_DIR=~/syncthing/PC-Walls ~/.config/wallpaper-randomizer/wallpaperRandom.sh'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Env keys: alt-w stays in work, alt-e jumps to personal.
    # goto-env.sh lands on each env's last workspace (W1/P1 if nothing recorded).
    alt-w = ['mode work', '''exec-and-forget ~/.config/aerospace/goto-env.sh work''', '''exec-and-forget osascript -e 'display notification "WORK env" with title "AeroSpace"' ''']
    alt-e = ['mode personal', '''exec-and-forget ~/.config/aerospace/goto-env.sh personal''', '''exec-and-forget osascript -e 'display notification "PERSONAL env" with title "AeroSpace"' ''']

    alt-shift-semicolon = 'mode service'

# =============================================================================
# MODE: personal — PERSONAL ENV (P1-P0 + commons)
# Mirror of work. alt-e stays here, alt-w jumps to work; both land on that
# env's last workspace via goto-env.sh.
# =============================================================================
[mode.personal.binding]

    alt-enter = '''exec-and-forget osascript -e '
    tell application "ghostty"
        do script ""
        activate
    end tell
    ' '''

    alt-b = '''exec-and-forget osascript -e '
    tell application "Safari"
        activate
    end tell
    ' '''

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Personal workspaces 1..0
    alt-1 = 'workspace P1'
    alt-2 = 'workspace P2'
    alt-3 = 'workspace P3'
    alt-4 = 'workspace P4'
    alt-5 = 'workspace P5'
    alt-6 = 'workspace P6'
    alt-7 = 'workspace P7'
    alt-8 = 'workspace P8'
    alt-9 = 'workspace P9'
    alt-0 = 'workspace P0'

    alt-shift-1 = 'move-node-to-workspace P1'
    alt-shift-2 = 'move-node-to-workspace P2'
    alt-shift-3 = 'move-node-to-workspace P3'
    alt-shift-4 = 'move-node-to-workspace P4'
    alt-shift-5 = 'move-node-to-workspace P5'
    alt-shift-6 = 'move-node-to-workspace P6'
    alt-shift-7 = 'move-node-to-workspace P7'
    alt-shift-8 = 'move-node-to-workspace P8'
    alt-shift-9 = 'move-node-to-workspace P9'
    alt-shift-0 = 'move-node-to-workspace P0'

    # Commons (same targets as every other mode)
    alt-a = 'workspace A'
    alt-s = 'workspace S'
    alt-d = 'workspace D'
    alt-f = 'workspace F'
    alt-shift-a = 'move-node-to-workspace A'
    alt-shift-s = 'move-node-to-workspace S'
    alt-shift-d = 'move-node-to-workspace D'
    alt-shift-f = 'move-node-to-workspace F'

    # Random wallpaper (same as main)
    alt-shift-n = 'exec-and-forget WALL_DIR=~/syncthing/PC-Walls ~/.config/wallpaper-randomizer/wallpaperRandom.sh'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Env keys: alt-e stays in personal, alt-w jumps to work.
    # goto-env.sh lands on each env's last workspace (W1/P1 if nothing recorded).
    alt-w = ['mode work', '''exec-and-forget ~/.config/aerospace/goto-env.sh work''', '''exec-and-forget osascript -e 'display notification "WORK env" with title "AeroSpace"' ''']
    alt-e = ['mode personal', '''exec-and-forget ~/.config/aerospace/goto-env.sh personal''', '''exec-and-forget osascript -e 'display notification "PERSONAL env" with title "AeroSpace"' ''']

    alt-shift-semicolon = 'mode service'

# =============================================================================
# MODE: service (unchanged, esc returns to main lobby)
# =============================================================================
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# =============================================================================
# COMMON: auto-route windows (global, applies in every mode)
# =============================================================================
[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
check-further-callbacks = true
run = "layout floating"

# Commons: Ente Auth -> A, Sublime Text -> S, Bitwarden -> D
[[on-window-detected]]
if.app-id = "io.ente.auth.mac"
run = "move-node-to-workspace A"

[[on-window-detected]]
if.app-id = "com.sublimetext.4"
run = "move-node-to-workspace S"

[[on-window-detected]]
if.app-id = "com.bitwarden.desktop"
run = "move-node-to-workspace D"

# =============================================================================
# COMMON: monitor assignment (every workspace follows the secondary/main pattern)
# =============================================================================
[workspace-to-monitor-force-assignment]
W1 = ['secondary', 'main']
W2 = ['secondary', 'main']
W3 = ['secondary', 'main']
W4 = ['secondary', 'main']
W5 = ['secondary', 'main']
W6 = ['secondary', 'main']
W7 = ['secondary', 'main']
W8 = ['secondary', 'main']
W9 = ['secondary', 'main']
W0 = ['secondary', 'main']
P1 = ['secondary', 'main']
P2 = ['secondary', 'main']
P3 = ['secondary', 'main']
P4 = ['secondary', 'main']
P5 = ['secondary', 'main']
P6 = ['secondary', 'main']
P7 = ['secondary', 'main']
P8 = ['secondary', 'main']
P9 = ['secondary', 'main']
P0 = ['secondary', 'main']
A = ['secondary', 'main']
S = ['secondary', 'main']
D = ['secondary', 'main']
F = ['secondary', 'main']
